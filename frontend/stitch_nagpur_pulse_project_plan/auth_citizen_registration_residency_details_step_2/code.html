<body class="bg-background text-on-surface font-body-md min-h-screen flex flex-col map-bg relative overflow-x-hidden">

<!-- Header -->
<header class="w-full z-10 px-gutter h-header-height flex justify-between items-center border-b border-surface-container-highest bg-surface-container/80 backdrop-blur-md">
<button class="flex items-center gap-2 text-on-surface-variant hover:text-primary transition-colors group">
<span class="material-symbols-outlined text-sm transition-transform group-hover:-translate-x-1" data-icon="arrow_back">arrow_back</span>
<span class="font-label-caps text-label-caps">Change Role</span>
</button>
<div class="text-right">
<span class="font-label-caps text-label-caps text-on-surface-variant block uppercase tracking-widest">Nagpur Pulse</span>
<span class="font-data-md text-data-md text-primary">Continuing as Citizen</span>
</div>
</header>
<!-- Main Content -->
<main class="flex-grow flex items-center justify-center p-gutter z-10 relative">
<!-- Auth Card -->
<div class="bg-surface-container border border-surface-container-highest rounded-lg w-full max-w-md shadow-2xl overflow-hidden relative">
<!-- Tab Toggle -->
<div class="flex border-b border-surface-container-highest bg-surface-container-low">
<button class="flex-1 py-4 font-label-caps text-label-caps transition-all text-on-surface-variant hover:text-on-surface" id="tab-login" onclick="switchTab('login')">
                    LOGIN
                </button>
<button class="flex-1 py-4 font-label-caps text-label-caps transition-all text-primary border-b-2 border-primary bg-surface-container" id="tab-register" onclick="switchTab('register')">
                    REGISTER
                </button>
</div>
<div class="p-lg">
<!-- Login State -->
<div class="block animate-fade-in hidden" id="view-login">
<div class="mb-lg">
<h1 class="font-headline-md text-headline-md text-on-surface mb-2">Welcome Back</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Enter your details to access the civic dashboard.</p>
</div>
<form class="space-y-md" onsubmit="handleLogin(event)">
<div class="space-y-2 glow-active transition-all rounded">
<label class="block font-label-caps text-label-caps text-on-surface-variant" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant" data-icon="mail">mail</span>
<input class="w-full bg-background border border-surface-container-highest text-on-surface font-body-md rounded pl-10 pr-3 py-2 focus:outline-none focus:border-primary transition-colors" id="email" placeholder="citizen@nagpur.gov" required="" type="email"/>
</div>
</div>
<div class="flex justify-end">
<a class="font-label-caps text-label-caps text-primary hover:text-primary-fixed transition-colors" href="#">Forgot Password?</a>
</div>
<button class="w-full bg-primary-container text-on-primary-container font-data-md text-data-md py-3 rounded hover:bg-primary transition-colors flex items-center justify-center gap-2" id="btn-login" type="submit">
<span class="">Continue with Google</span>
</button>
</form>
<div class="mt-lg text-center border-t border-surface-container-highest pt-md">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                            Authority or Admin? <a class="text-primary hover:underline font-label-caps text-label-caps ml-1" href="#">Secure Login</a>
</p>
</div>
</div>
<!-- Register State -->
<div class="" id="view-register">
<div class="mb-lg flex justify-between items-end">
<div><h1 class="font-headline-md text-headline-md text-on-surface mb-1">Citizen Registration</h1><p class="font-body-sm text-body-sm text-on-surface-variant">Step 2 of 2: Residency Details</p></div>
<div class="flex gap-2">
<button class="w-10 h-10 flex items-center justify-center rounded border border-surface-container-highest font-data-lg text-data-lg text-on-surface-variant hover:text-primary hover:border-primary transition-all" title="Back to Step 1" type="button">
    01
  </button>
<div class="w-10 h-10 flex items-center justify-center rounded border-2 border-primary bg-primary/10 font-data-lg text-data-lg text-primary shadow-[0_0_8px_rgba(250,92,27,0.3)]">
    02
  </div>
</div>
</div>
<form class="space-y-md" onsubmit="handleRegister(event)"><div class="space-y-2 glow-active transition-all rounded mt-0"><label class="block font-label-caps text-label-caps text-on-surface-variant" for="reg-gender">Gender</label><select class="w-full bg-background border border-surface-container-highest text-on-surface font-body-md rounded px-3 py-2 focus:outline-none focus:border-primary transition-colors appearance-none" id="reg-gender" required=""><option disabled="" selected="" value="">Select Gender</option><option value="male">Male</option><option value="female">Female</option><option value="other">Other</option><option value="prefer-not-to-say">Prefer not to say</option></select></div><div class="space-y-2 glow-active transition-all rounded"><label class="block font-label-caps text-label-caps text-on-surface-variant" for="reg-area">Local Area of Residency</label><input class="w-full bg-background border border-surface-container-highest text-on-surface font-body-md rounded px-3 py-2 focus:outline-none focus:border-primary transition-colors" id="reg-area" placeholder="Enter your area" required="" type="text"/></div><div class="space-y-2 glow-active transition-all rounded"><label class="block font-label-caps text-label-caps text-on-surface-variant" for="reg-location">Location / Address Area</label><div class="relative"><span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant" data-icon="search">search</span><input class="w-full bg-background border border-surface-container-highest text-on-surface font-body-md rounded pl-10 pr-3 py-2 focus:outline-none focus:border-primary transition-colors" id="reg-location" placeholder="Search your location" required="" type="text"/></div></div><button class="w-full bg-primary-container text-on-primary-container font-data-md text-data-md py-3 rounded hover:bg-primary transition-colors flex items-center justify-center gap-2 mt-lg" type="submit"><span class="">Create Citizen Account</span></button><div class="mt-md text-center"><a class="text-primary hover:underline font-label-caps text-label-caps" href="#" onclick="switchTab('login')">Already have an account? Login</a></div></form>
</div>
</div>
<!-- Processing Overlay (Hidden by default) -->
<div class="absolute inset-0 bg-surface-container/90 backdrop-blur-sm hidden flex-col items-center justify-center z-20" id="processing-overlay">
<span class="material-symbols-outlined animate-spin text-primary text-headline-xl mb-4" data-icon="progress_activity">progress_activity</span>
<p class="font-label-caps text-label-caps text-on-surface uppercase tracking-widest" id="processing-text">Authenticating...</p>
</div>
</div>
</main>
<script>
        function switchTab(tab) {
            const loginBtn = document.getElementById('tab-login');
            const registerBtn = document.getElementById('tab-register');
            const loginView = document.getElementById('view-login');
            const registerView = document.getElementById('view-register');

            if (tab === 'login') {
                loginBtn.classList.add('text-primary', 'border-b-2', 'border-primary', 'bg-surface-container');
                loginBtn.classList.remove('text-on-surface-variant', 'hover:text-on-surface');
                
                registerBtn.classList.remove('text-primary', 'border-b-2', 'border-primary', 'bg-surface-container');
                registerBtn.classList.add('text-on-surface-variant', 'hover:text-on-surface');

                loginView.classList.remove('hidden');
                registerView.classList.add('hidden');
            } else {
                registerBtn.classList.add('text-primary', 'border-b-2', 'border-primary', 'bg-surface-container');
                registerBtn.classList.remove('text-on-surface-variant', 'hover:text-on-surface');
                
                loginBtn.classList.remove('text-primary', 'border-b-2', 'border-primary', 'bg-surface-container');
                loginBtn.classList.add('text-on-surface-variant', 'hover:text-on-surface');

                registerView.classList.remove('hidden');
                loginView.classList.add('hidden');
            }
        }

        function showProcessing(text) {
            const overlay = document.getElementById('processing-overlay');
            const textEl = document.getElementById('processing-text');
            textEl.innerText = text;
            overlay.classList.remove('hidden');
            overlay.classList.add('flex');
            
            // Simulate network request
            setTimeout(() => {
                overlay.classList.add('hidden');
                overlay.classList.remove('flex');
            }, 2000);
        }

        function handleLogin(e) {
            e.preventDefault();
            showProcessing('Sending Magic Link...');
        }

        function handleRegister(e) {
            e.preventDefault();
            showProcessing('Saving Details...');
        }
    </script>
</body></html>
